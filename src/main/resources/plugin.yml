name: GlowLights
version: '${version}'
main: impishi.imsag.GlowLights
api-version: '1.21'
folia-supported: true
website: https://impishi.ir
author: impishi
description: Server-side Dynamic Lighting
commands:
  glowlights:
    aliases: [gl, glowlight]
    description: main command
    usage: /gl <toggle|reload|status>
permissions:
  glowlights.toggle:
    default: true
  glowlights.reload:
    default: op
  glowlights.status:
    default: op